version: '3.8'

volumes:
  ollama_data: {}

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # To pull a model after startup, you would typically run:
    # docker exec <container_name_or_id> ollama pull mistral
    # This can be added to a startup script or run manually once.

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=mistral # Or any other model you want to use by default
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    # For development with live reload, uncomment the following:
    # volumes:
    #   - ./app:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:5000
      # Streamlit specific env vars if needed, though CMD handles common ones
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
    # For development with live reload, uncomment the following:
    # volumes:
    #   - ./frontend:/app
